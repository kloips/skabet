<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3">
<title>Skabet</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Skabet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Skabet</h1>
  <span class="weather" id="weather">9–14° · overskyet</span>
</header>

<main>
  <div class="lay" id="lay">
    <div class="slot" data-cat="outerwear">
      <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås jakke" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-prev" type="button" data-action="prev" aria-label="Forrige jakke"><img src="img/pil.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Næste jakke"><img src="img/pil.jpg" alt=""></button>
    </div>
    <div class="slot" data-cat="top">
      <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås overdel" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-prev" type="button" data-action="prev" aria-label="Forrige overdel"><img src="img/pil.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Næste overdel"><img src="img/pil.jpg" alt=""></button>
    </div>
    <div class="slot" data-cat="mid">
      <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås trøje" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-prev" type="button" data-action="prev" aria-label="Forrige trøje"><img src="img/pil.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Næste trøje"><img src="img/pil.jpg" alt=""></button>
    </div>
    <div class="slot" data-cat="bottom">
      <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås bukser" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-prev" type="button" data-action="prev" aria-label="Forrige bukser"><img src="img/pil.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Næste bukser"><img src="img/pil.jpg" alt=""></button>
    </div>
    <div class="slot" data-cat="shoes">
      <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås sko" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-prev" type="button" data-action="prev" aria-label="Forrige sko"><img src="img/pil.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Næste sko"><img src="img/pil.jpg" alt=""></button>
    </div>
  </div>
  <div class="meta" id="meta"></div>

  <section class="favorites" id="favorites" hidden>
    <span class="favorites-label">Favoritter</span>
    <div class="favorites-list" id="favoritesList"></div>
  </section>
</main>

<footer>
  <button class="primary" id="shuffle">Giv mig et sæt</button>
  <button class="ghost" id="favorite" type="button" aria-pressed="false" aria-label="Gem som favorit">☆</button>
  <button class="ghost" id="addItemBtn" type="button" aria-label="Tilføj tøj">+</button>
</footer>

<dialog id="addDialog">
  <form id="addForm">
    <h2>Tilføj tøj</h2>
    <label>Billede (fx en sticker fra kamerarullen)
      <input type="file" id="addPhoto" accept="image/*" required>
    </label>
    <label>Kategori
      <select id="addCategory" required>
        <option value="outerwear">Jakke</option>
        <option value="mid">Trøje</option>
        <option value="top">Overdel</option>
        <option value="bottom">Bukser</option>
        <option value="shoes">Sko</option>
      </select>
    </label>
    <label>Navn
      <input type="text" id="addName" placeholder="Fx Brun jakke" required>
    </label>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="addCancel">Annuller</button>
      <button type="submit" class="primary">Gem</button>
    </div>
  </form>
</dialog>

<script src="script.js" defer></script>
</body>
</html>
