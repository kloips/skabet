<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3">
<title>Skabet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F6F3;
    --card:#FFFFFF;
    --ink:#17181A;
    --ink-soft:#6B6A66;
    --line:#E3E1DB;
    --accent:#1F4D3D;
    --slot-h:185px;
    --radius:14px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{-webkit-text-size-adjust:100%}

  body{
    background:var(--paper);
    color:var(--ink);
    font:400 15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  header{
    padding:22px 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }

  h1{
    font-family:"Instrument Serif",Georgia,serif;
    font-weight:400;
    font-size:30px;
    letter-spacing:-.01em;
    line-height:1;
  }

  .weather{
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.06em;
    text-transform:uppercase;
    white-space:nowrap;
  }

  main{flex:1;padding:0 20px 20px}

  /* Flat-lay: jakke, troeje, t-shirt, bukser og sko i hver sin fulde raekke. */
  .lay{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px;
    display:grid;
    grid-template-columns:1fr;
    grid-template-areas:
      "jacket"
      "mid"
      "top"
      "bottom"
      "shoes";
    gap:10px;
  }

  .slot{
    position:relative;
    height:var(--slot-h);
    display:grid;
    place-items:center;        /* saa gammelt og nyt billede kan ligge oveni hinanden under en crossfade */
    container-type:size;       /* goer cqw/cqh tilgaengelig til at kompensere for rotationen */
    border-radius:10px;
  }

  .slot[data-cat="outerwear"]{grid-area:jacket}
  .slot[data-cat="mid"]{grid-area:mid}
  .slot[data-cat="top"]{grid-area:top}
  .slot[data-cat="bottom"]{grid-area:bottom}
  .slot[data-cat="shoes"]{grid-area:shoes}

  .slot img.garment{
    grid-area:1 / 1;          /* stabler gammelt og nyt billede oveni hinanden under en crossfade */
    max-width:100cqw;         /* cqw/cqh i stedet for % - en grid-raekke uden fast hoejde goer % upaalidelig */
    max-height:100cqh;
    object-fit:contain;      /* holder proportionerne uanset billedstoerrelse */
    display:block;
    border-radius:8px;       /* pynter paa firkantede JPG'er, usynlig paa fritlagte PNG'er */
    filter:drop-shadow(0 6px 10px rgba(23,24,26,.10));
    transition:opacity .32s ease;
  }

  .slot img.garment.entering,
  .slot img.garment.leaving{opacity:0}

  /* Alt toej udover sko er fotograferet paa siden, saa det roteres 90 grader op. */
  .slot:not([data-cat="shoes"]) img.garment{
    max-width:100cqh;
    max-height:100cqw;
    transform:rotate(90deg);
  }

  .slot.empty{border:1px dashed var(--line);border-radius:10px}

  /* Laase-ikon i hjoernet, og pile i siderne til at skifte toej. */
  .icon-btn{
    position:absolute;
    top:6px;
    right:6px;
    z-index:3;
    width:50px;
    height:50px;
    padding:0;
    border-radius:50%;
    overflow:hidden;
    border:1px solid var(--line);
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:box-shadow .15s ease, border-color .15s ease;
  }

  .icon-btn img{
    width:100%;
    height:100%;
    padding:5px;
    object-fit:contain;      /* viser hele ikonet i stedet for at beskaere det */
  }

  .icon-btn:active{transform:scale(.94)}

  .lock-btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}

  /* Pilene sidder lodret centreret i hver side af billedet. */
  .nav-btn{
    top:50%;
    transform:translateY(-50%);
    z-index:4;
  }

  .nav-btn:active{transform:translateY(-50%) scale(.94)}

  .nav-prev{left:6px;right:auto}
  .nav-next{right:6px}

  /* pil.jpg har en tynd kant om billedet - zoom ind saa kun selve pilen ses. */
  .nav-btn img{padding:0;transform:scale(2)}
  .nav-prev img{transform:scaleX(-1) scale(2)}

  .meta{
    margin:14px 2px 0;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }

  .chip{
    font-size:12px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 10px;
    background:var(--card);
  }

  .favorites{margin:16px 2px 0}

  .favorites-label{
    display:block;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .favorites-list{display:flex;flex-wrap:wrap;gap:6px}

  .fav-chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer}

  .fav-remove{color:var(--ink-soft);font-size:14px;line-height:1}
  .fav-remove:hover{color:var(--ink)}

  footer{
    position:sticky;
    bottom:0;
    padding:12px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--paper) 65%,transparent);
    display:flex;
    gap:10px;
  }

  button{
    font:inherit;
    font-weight:500;
    border-radius:12px;
    padding:15px 18px;
    cursor:pointer;
    border:1px solid transparent;
    transition:transform .1s ease, background .15s ease;
  }

  button:active{transform:scale(.985)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .primary{flex:1;background:var(--accent);color:#fff}
  .primary:hover{background:#18402F}

  .ghost{background:var(--card);border-color:var(--line);color:var(--ink);padding-inline:16px}
  .ghost[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

  dialog{
    border:none;
    border-radius:var(--radius);
    padding:22px;
    width:min(340px, 90vw);
    background:var(--card);
    color:var(--ink);
  }

  dialog::backdrop{background:rgba(23,24,26,.45)}

  dialog h2{
    font-family:"Instrument Serif",Georgia,serif;
    font-weight:400;
    font-size:24px;
    margin-bottom:16px;
  }

  #addForm label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:14px}

  #addForm input,
  #addForm select{
    display:block;
    width:100%;
    margin-top:6px;
    padding:10px;
    font:inherit;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
  }

  .dialog-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
  .dialog-actions button{padding:10px 16px}

  @media (prefers-reduced-motion:reduce){
    .slot img,button{transition:none}
  }

  @media (min-width:520px){
    main{max-width:460px;margin-inline:auto;width:100%}
    header,footer{max-width:460px;margin-inline:auto;width:100%}
  }
</style>
</head>
<body>

<header>
  <h1>Skabet</h1>
  <span class="weather" id="weather">14° · overskyet</span>
</header>

<main>
  <div class="lay" id="lay">
    <div class="slot" data-cat="outerwear">
      <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås jakke" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-prev" type="button" data-action="prev" aria-label="Forrige jakke"><img src="img/pil.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Næste jakke"><img src="img/pil.jpg" alt=""></button>
    </div>
    <div class="slot" data-cat="top">
      <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås overdel" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-prev" type="button" data-action="prev" aria-label="Forrige overdel"><img src="img/pil.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Næste overdel"><img src="img/pil.jpg" alt=""></button>
    </div>
    <div class="slot" data-cat="mid">
      <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås trøje" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-prev" type="button" data-action="prev" aria-label="Forrige trøje"><img src="img/pil.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Næste trøje"><img src="img/pil.jpg" alt=""></button>
    </div>
    <div class="slot" data-cat="bottom">
      <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås bukser" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-prev" type="button" data-action="prev" aria-label="Forrige bukser"><img src="img/pil.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Næste bukser"><img src="img/pil.jpg" alt=""></button>
    </div>
    <div class="slot" data-cat="shoes">
      <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås sko" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-prev" type="button" data-action="prev" aria-label="Forrige sko"><img src="img/pil.jpg" alt=""></button>
      <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Næste sko"><img src="img/pil.jpg" alt=""></button>
    </div>
  </div>
  <div class="meta" id="meta"></div>

  <section class="favorites" id="favorites" hidden>
    <span class="favorites-label">Favoritter</span>
    <div class="favorites-list" id="favoritesList"></div>
  </section>
</main>

<footer>
  <button class="primary" id="shuffle">Giv mig et sæt</button>
  <button class="ghost" id="favorite" type="button" aria-pressed="false" aria-label="Gem som favorit">☆</button>
  <button class="ghost" id="addItemBtn" type="button" aria-label="Tilføj tøj">+</button>
</footer>

<dialog id="addDialog">
  <form id="addForm">
    <h2>Tilføj tøj</h2>
    <label>Billede (fx en sticker fra kamerarullen)
      <input type="file" id="addPhoto" accept="image/*" required>
    </label>
    <label>Kategori
      <select id="addCategory" required>
        <option value="outerwear">Jakke</option>
        <option value="mid">Trøje</option>
        <option value="top">Overdel</option>
        <option value="bottom">Bukser</option>
        <option value="shoes">Sko</option>
      </select>
    </label>
    <label>Navn
      <input type="text" id="addName" placeholder="Fx Brun jakke" required>
    </label>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="addCancel">Annuller</button>
      <button type="submit" class="primary">Gem</button>
    </div>
  </form>
</dialog>

<script>
/* ---------------------------------------------------------------
   Dit toej. Filnavnet bestemmer kategorien, teksten er det navn
   der vises under saettet. Ret navnene så de passer til dit toej.
   Tilfoej en ny linje naar du fotograferer mere.
----------------------------------------------------------------*/
const files = {
  "outerwear-1.png": "Brun jakke",
  "outerwear-2.png": "Sort jakke",

  "mid-1.png":       "Sort sweatshirt",
  "mid-2.png":       "Brun strik",

  "top-1.png":       "Sort t-shirt",
  "top-2.png":       "Sort t-shirt med print",
  "top-3.png":       "Grå t-shirt",

  "bottom-1.png":    "Grå bukser",
  "bottom-2.png":    "Blå jeans",

  "shoes-1.JPG":     "Sneakers",
  "shoes-2.JPG":     "Sko"
};

const builtInItems = Object.entries(files).map(([file, name], i) => ({
  id: i + 1,
  name,
  category: file.split("-")[0],
  image: "img/" + file
}));

/* Toej tilfoejet fra formularen. Gemmes i localStorage, saa det kun findes paa den enhed det er tilfoejet fra. */
const EXTRA_ITEMS_KEY = "skabet-extra-items";

function loadExtraItems(){
  try {
    return JSON.parse(localStorage.getItem(EXTRA_ITEMS_KEY)) || [];
  } catch {
    return [];
  }
}

function saveExtraItems(list){
  localStorage.setItem(EXTRA_ITEMS_KEY, JSON.stringify(list));
}

let items = [];

function rebuildItems(){
  items = [...builtInItems, ...loadExtraItems()];
}

rebuildItems();

/* --------------------------- Logik --------------------------- */

const lay           = document.getElementById("lay");
const meta          = document.getElementById("meta");
const weatherEl     = document.getElementById("weather");
const favoritesEl   = document.getElementById("favorites");
const favoritesList = document.getElementById("favoritesList");
const favoriteBtn   = document.getElementById("favorite");
const addItemBtn    = document.getElementById("addItemBtn");
const addDialog     = document.getElementById("addDialog");
const addForm       = document.getElementById("addForm");
const addPhoto      = document.getElementById("addPhoto");
const addCategory   = document.getElementById("addCategory");
const addName       = document.getElementById("addName");
const addCancel     = document.getElementById("addCancel");
const slots         = [...lay.querySelectorAll(".slot")];

const CATS = ["outerwear", "mid", "top", "bottom", "shoes"];

const lockedCats = new Set();   // kategorier der skal beholde deres nuvaerende toej
let current = {};
let temp = 14;                  // fallback hvis vejret ikke kan hentes

/* Koebenhavn, ingen API-noegle noedvendig. */
const weatherCodes = {
  0:"klart vejr", 1:"let skyet", 2:"delvist skyet", 3:"overskyet",
  45:"taage", 48:"rimtaage",
  51:"let styrtregn", 53:"styrtregn", 55:"kraftig styrtregn",
  61:"let regn", 63:"regn", 65:"kraftig regn",
  71:"let sne", 73:"sne", 75:"kraftig sne",
  80:"byger", 81:"kraftige byger", 82:"voldsomme byger",
  95:"torden"
};

async function fetchWeather(){
  try {
    const res  = await fetch("https://api.open-meteo.com/v1/forecast?latitude=55.68&longitude=12.57&current_weather=true");
    const data = await res.json();
    return data.current_weather;
  } catch {
    return null;                  // ingen forbindelse, brug fallback-temperaturen
  }
}

const HISTORY_KEY = "skabet-history";

function loadHistory(){
  try {
    return JSON.parse(localStorage.getItem(HISTORY_KEY)) || {};
  } catch {
    return {};
  }
}

function saveHistory(outfit){
  const record = { date: new Date().toISOString().slice(0, 10) };
  Object.keys(outfit).forEach(cat => {
    if (outfit[cat]) record[cat] = outfit[cat].id;
  });
  localStorage.setItem(HISTORY_KEY, JSON.stringify(record));
}

const FAVORITES_KEY = "skabet-favorites";

function loadFavorites(){
  try {
    return JSON.parse(localStorage.getItem(FAVORITES_KEY)) || [];
  } catch {
    return [];
  }
}

function saveFavorites(favorites){
  localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
}

const outfitKey = outfit => CATS.map(cat => outfit[cat]?.id ?? "").join(",");
const recordKey = record => CATS.map(cat => record[cat] ?? "").join(",");

function renderFavorites(){
  const favorites = loadFavorites();
  favoritesEl.hidden = favorites.length === 0;
  favoritesList.innerHTML = "";
  favorites.forEach(record => {
    const names = CATS.map(cat => items.find(i => i.id === record[cat])?.name).filter(Boolean).join(" · ");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip fav-chip";
    btn.dataset.favId = record.id;
    btn.innerHTML = `${names} <span class="fav-remove" data-remove aria-label="Fjern favorit">×</span>`;
    favoritesList.append(btn);
  });
}

function loadFavorite(record){
  const outfit = {};
  CATS.forEach(cat => {
    const item = items.find(i => i.id === record[cat]);
    if (item) outfit[cat] = item;
  });
  current = outfit;
  render(current);
  saveHistory(current);
  updateFavoriteButton();
}

function removeFavorite(id){
  saveFavorites(loadFavorites().filter(f => f.id !== id));
  renderFavorites();
  updateFavoriteButton();
}

function updateFavoriteButton(){
  const isFav = loadFavorites().some(f => recordKey(f) === outfitKey(current));
  favoriteBtn.setAttribute("aria-pressed", String(isFav));
  favoriteBtn.textContent = isFav ? "★" : "☆";
}

const pick = (cat, avoidId) => {
  let pool = items.filter(i => i.category === cat);
  if (avoidId != null && pool.length > 1){
    pool = pool.filter(i => i.id !== avoidId);   // undgaa gaarsdagens stykke naar der er et alternativ
  }
  return pool[Math.floor(Math.random() * pool.length)];
};

function buildOutfit(){
  const history = loadHistory();
  const today   = new Date().toISOString().slice(0, 10);
  const isNewDay = history.date && history.date !== today;

  const wanted = {
    top:       true,
    bottom:    true,
    shoes:     true,
    mid:       true,
    outerwear: true
  };
  const next = {};
  Object.keys(wanted).forEach(cat => {
    if (lockedCats.has(cat) && current[cat]){
      next[cat] = current[cat];
    } else if (wanted[cat]){
      next[cat] = pick(cat, isNewDay ? history[cat] : null);
    }
  });
  return next;
}

const SWAP_FADE_MS = 320;   // skal matche transition-varigheden for img.garment i CSS'en

function renderSlot(slot, item){
  // Ved hurtige swipes efter hinanden kan flere billeder vaere ved at forsvinde samtidig ("leaving").
  // Det aktuelt synlige billede er derfor det sidste der IKKE allerede er paa vej ud.
  const stillCurrent = slot.querySelectorAll("img.garment:not(.leaving)");
  const oldImg = stillCurrent[stillCurrent.length - 1] || null;

  if (!item){
    if (oldImg){
      oldImg.classList.add("leaving");
      setTimeout(() => oldImg.remove(), SWAP_FADE_MS);
    }
    slot.classList.add("empty");         // fx ingen jakke naar det er varmt
    return;
  }

  slot.classList.remove("empty");

  const newImg = new Image();
  newImg.className = "garment entering";
  newImg.alt = item.name;

  let revealed = false;
  const reveal = () => {
    if (revealed) return;
    revealed = true;
    void newImg.offsetWidth;             // tving reflow, saa fade-in starter fra den skjulte tilstand
    newImg.classList.remove("entering");
    if (oldImg){
      oldImg.classList.add("leaving");   // gammelt og nyt billede krydsblendes samtidig
      setTimeout(() => oldImg.remove(), SWAP_FADE_MS);
    }
  };

  newImg.addEventListener("load", reveal, { once: true });
  newImg.src = item.image;
  slot.append(newImg);
  if (newImg.complete) reveal();         // allerede indlaest/cachet, ingen grund til at vente
}

function renderMeta(outfit){
  meta.innerHTML = "";
  ["outerwear","mid","top","bottom","shoes"].forEach(cat => {
    if (!outfit[cat]) return;
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = outfit[cat].name;
    meta.append(chip);
  });
}

function render(outfit){
  slots.forEach(slot => renderSlot(slot, outfit[slot.dataset.cat]));
  renderMeta(outfit);
}

function shuffle(){
  current = buildOutfit();
  render(current);
  saveHistory(current);
  updateFavoriteButton();
}

document.getElementById("shuffle").addEventListener("click", shuffle);

favoriteBtn.addEventListener("click", () => {
  const favorites = loadFavorites();
  const key = outfitKey(current);
  const existingIndex = favorites.findIndex(f => recordKey(f) === key);
  if (existingIndex > -1){
    favorites.splice(existingIndex, 1);
  } else {
    const record = { id: Date.now() };
    CATS.forEach(cat => { if (current[cat]) record[cat] = current[cat].id; });
    favorites.push(record);
  }
  saveFavorites(favorites);
  renderFavorites();
  updateFavoriteButton();
});

favoritesList.addEventListener("click", e => {
  const btn = e.target.closest(".fav-chip");
  if (!btn) return;
  const id = Number(btn.dataset.favId);
  if (e.target.closest("[data-remove]")){
    removeFavorite(id);
    return;
  }
  const record = loadFavorites().find(f => f.id === id);
  if (record) loadFavorite(record);
});

lay.addEventListener("click", e => {
  const btn = e.target.closest(".icon-btn");
  if (!btn) return;
  const slot = btn.closest(".slot");
  const cat  = slot.dataset.cat;
  if (!current[cat]) return;               // intet toej i slotten

  if (btn.dataset.action === "lock"){
    const isLocked = !lockedCats.has(cat);
    lockedCats[isLocked ? "add" : "delete"](cat);
    btn.setAttribute("aria-pressed", String(isLocked));
    return;
  }

  if (btn.dataset.action === "prev") cycleSlot(slot, -1);
  if (btn.dataset.action === "next") cycleSlot(slot, 1);
});

/* Skalerer et billede ned via canvas, saa det fylder mindre i localStorage.
   PNG bevarer gennemsigtigheden fra en sticker fra kamerarullen. */
function resizeImage(file, maxDim){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/png"));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

addItemBtn.addEventListener("click", () => addDialog.showModal());
addCancel.addEventListener("click", () => addDialog.close());

addForm.addEventListener("submit", async e => {
  e.preventDefault();
  const file = addPhoto.files[0];
  if (!file) return;

  const image = await resizeImage(file, 1000);
  const extra = loadExtraItems();
  extra.push({
    id: "x" + Date.now(),
    name: addName.value.trim(),
    category: addCategory.value,
    image
  });

  try {
    saveExtraItems(extra);
  } catch {
    alert("Kunne ikke gemme billedet — der er nok ikke mere plads. Prøv evt. et andet billede.");
    return;
  }

  rebuildItems();
  addForm.reset();
  addDialog.close();
});

/* Pilene blader frem/tilbage gennem den paagaeldende kategoris toej. */
function cycleSlot(slot, direction){
  const cat = slot.dataset.cat;
  if (!current[cat] || lockedCats.has(cat)) return;   // intet toej, eller laast
  const pool = items.filter(i => i.category === cat);
  if (pool.length <= 1) return;
  const idx     = pool.findIndex(i => i.id === current[cat].id);
  const nextIdx = (idx + direction + pool.length) % pool.length;
  current[cat] = pool[nextIdx];
  renderSlot(slot, current[cat]);
  renderMeta(current);
  saveHistory(current);
  updateFavoriteButton();
}

async function init(){
  const w = await fetchWeather();
  if (w){
    temp = w.temperature;
    weatherEl.textContent = `${Math.round(w.temperature)}° · ${weatherCodes[w.weathercode] || "ukendt vejr"}`;
  }
  renderFavorites();
  shuffle();
}

init();
