<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3">
<title>Skabet</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Skabet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<!-- ?v= tvinger Safari til at hente filen paa ny. Bump datoen naar du aendrer
     style.css eller script.js - ellers kan telefonen sidde fast paa en gammel
     udgave, selvom den nye er pushet. -->
<link rel="stylesheet" href="style.css?v=20260903b">
</head>
<body>

<header>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu">
    <!-- De tre streger er ens - det er kun deres transform der goer dem til
         enten et menu-ikon eller pilespids + skaft. Loekken tegnes ind til sidst. -->
    <svg class="menu-ikon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path class="mi-loekke" d="M14.5 10 A4.6 4.6 0 0 1 14.5 19.2 L7.5 19.2"/>
      <line class="mi-streg mi-top"  x1="4" y1="12" x2="20" y2="12"/>
      <line class="mi-streg mi-midt" x1="4" y1="12" x2="20" y2="12"/>
      <line class="mi-streg mi-bund" x1="4" y1="12" x2="20" y2="12"/>
    </svg>
  </button>
  <h1>Skabet</h1>
</header>

<nav class="menu" id="menu" hidden>
  <button class="menu-item" type="button" data-view="skab">Mit klædeskab</button>
  <button class="menu-item" type="button" data-view="outfit">Vælg Outfit</button>
  <button class="menu-item" type="button" data-view="favoritter">Favorit Outfits</button>
</nav>

<main>

<!-- Mit klaedeskab: alt toejet, kategori for kategori. -->
<section class="view" id="view-skab" hidden>
  <!-- To tilstande i samme sektion: oversigt og kategori-side. Tilbage-knappen
       vises kun paa kategori-siden - det er IKKE et fjerde menupunkt. -->
  <button class="skab-tilbage" id="skabTilbage" type="button" hidden>← Alle kategorier</button>
  <h2 class="view-title" id="skabTitel">Mit klædeskab</h2>
  <div id="wardrobe"></div>
</section>

<!-- Vaelg Outfit: selve flat-layet, det man lander paa om morgenen. -->
<section class="view" id="view-outfit">
  <!-- Vejret staar her og ikke i headeren, saa det flugter med "Lejlighed". -->
  <div class="occasion-raekke">
    <!-- Egen menu i stedet for en <select>: browserens indbyggede dropdown
         kan ikke styles. Punkterne bygges fra OCCASIONS i script.js. -->
    <div class="occasion">
      <span class="occasion-label" id="occasionLabel">Lejlighed</span>
      <div class="vaelger">
        <button class="vaelger-knap" id="occasionBtn" type="button"
                aria-haspopup="listbox" aria-expanded="false"
                aria-labelledby="occasionLabel occasionVaerdi">
          <span id="occasionVaerdi">Alt</span>
          <svg class="vaelger-pil" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1l5 5 5-5"/></svg>
        </button>
        <ul class="vaelger-liste" id="occasionListe" role="listbox" hidden></ul>
      </div>
    </div>
    <!-- To linjer, saa de flugter med "Lejlighed" og selecten til venstre. -->
    <span class="weather" id="weather">
      <span class="weather-temp" id="weatherTemp">9–14°</span>
      <span class="weather-navn" id="weatherNavn">Overskyet</span>
    </span>
  </div>

  <div class="lay" id="lay">
    <div class="slot" data-cat="outerwear">
      <div class="slot-actions">
        <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås jakke" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
        <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Skift jakke"><img src="img/pil.jpg" alt=""></button>
      </div>
    </div>
    <div class="slot" data-cat="top">
      <div class="slot-actions">
        <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås overdel" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
        <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Skift overdel"><img src="img/pil.jpg" alt=""></button>
      </div>
    </div>
    <div class="slot" data-cat="mid">
      <div class="slot-actions">
        <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås trøje" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
        <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Skift trøje"><img src="img/pil.jpg" alt=""></button>
      </div>
    </div>
    <div class="slot" data-cat="bottom">
      <div class="slot-actions">
        <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås bukser" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
        <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Skift bukser"><img src="img/pil.jpg" alt=""></button>
      </div>
    </div>
    <div class="slot" data-cat="shoes">
      <div class="slot-actions">
        <button class="icon-btn lock-btn" type="button" data-action="lock" aria-label="Lås sko" aria-pressed="false"><img src="img/lock-icon.jpg" alt=""></button>
        <button class="icon-btn nav-btn nav-next" type="button" data-action="next" aria-label="Skift sko"><img src="img/pil.jpg" alt=""></button>
      </div>
    </div>
  </div>
  <div class="meta" id="meta"></div>
</section>

<!-- Favorit Outfits: gemte saet, tryk henter et frem paa Vaelg Outfit. -->
<section class="view" id="view-favoritter" hidden>
  <h2 class="view-title">Favorit Outfits</h2>
  <p class="tom-besked" id="favoritesEmpty" hidden>Du har ingen gemte sæt endnu. Tryk på ☆ under et outfit for at gemme det.</p>
  <!-- Et saet ad gangen, bladres vandret med scroll-snap. Egne klasser og
       hoejder - flat-layets .lay/.slot/.garment maa ikke genbruges her. -->
  <div class="fav-baand" id="favoritesList"></div>
</section>

</main>

<footer id="footer">
  <!-- Knapperne skifter med visningen - se visView() i script.js. -->
  <div class="footer-group" data-footer="outfit">
    <button class="primary" id="shuffle">Giv mig et sæt</button>
    <button class="ghost" id="favorite" type="button" aria-pressed="false" aria-label="Gem som favorit">☆</button>
    <button class="ghost" id="woreBtn" type="button" aria-pressed="false" aria-label="Det tog jeg paa i dag">✓</button>
    <!-- disabled staar her og ikke kun i JS, saa knappen ogsaa er slaaet fra
         i det oejeblik siden vises, foer vejret er hentet og shuffle er kaldt. -->
    <button class="ghost" id="undoBtn" type="button" disabled aria-label="Fortryd, tilbage til forrige saet"><span class="undo-ikon">↺</span></button>
  </div>
  <div class="footer-group" data-footer="skab" hidden>
    <button class="primary" id="addItemBtn" type="button">+ Tilføj tøj</button>
  </div>
</footer>

<!-- Forstoerret toejbillede. Bevidst IKKE en <dialog>: der er ingen felter at
     udfylde, saa backdrop og fokusfaelde ville kun vaere noget at styre udenom.
     Billedet har sin egen klasse, saa .slot img.garment ikke rammer det. -->
<div class="zoom" id="zoom" hidden>
  <img class="zoom-billede" id="zoomBillede" src="" alt="">
  <p class="zoom-navn" id="zoomNavn"></p>
</div>

<dialog id="addDialog">
  <form id="addForm">
    <h2>Tilføj tøj</h2>
    <label>Billede (fx en sticker fra kamerarullen)
      <input type="file" id="addPhoto" accept="image/*" required>
    </label>
    <label>Kategori
      <select id="addCategory" required>
        <option value="outerwear">Jakke</option>
        <option value="mid">Trøje</option>
        <option value="top">Overdel</option>
        <option value="bottom">Bukser</option>
        <option value="shoes">Sko</option>
      </select>
    </label>
    <label>Navn
      <input type="text" id="addName" placeholder="Fx Brun jakke" required>
    </label>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="addCancel">Annuller</button>
      <button type="submit" class="primary">Gem</button>
    </div>
  </form>
</dialog>

<script src="script.js?v=20260903b" defer></script>
</body>
</html>
